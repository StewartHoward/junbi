name: Set up demo database

# Run by hand from the Actions tab. Creates the tables and security rules in the
# hosted demo database, then fills it with the fake demo club.
# WARNING: "Reset demo data" wipes every row. Never point this at a real club's database.

on:
  workflow_dispatch:
    inputs:
      reset_demo_data:
        description: "Wipe and refill the demo club data"
        type: boolean
        default: true

jobs:
  setup:
    runs-on: ubuntu-latest
    env:
      DATABASE_ADMIN_URL: ${{ secrets.DEMO_DATABASE_ADMIN_URL }}
      JUNBI_APP_DB_PASSWORD: ${{ secrets.JUNBI_APP_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Apply migrations
        run: npm run db:migrate
      - name: Seed demo club
        if: ${{ inputs.reset_demo_data }}
        run: npm run db:seed
        env:
          JUNBI_CONFIRM_DEMO_SEED: "1"
