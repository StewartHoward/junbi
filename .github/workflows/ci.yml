name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: junbi
          POSTGRES_PASSWORD: junbi
          POSTGRES_DB: junbi_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U junbi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_ADMIN_URL: postgres://junbi:junbi@localhost:5432/junbi_test
      TEST_DATABASE_URL: postgres://junbi_app:junbi_app@localhost:5432/junbi_test
      DATABASE_URL: postgres://junbi_app:junbi_app@localhost:5432/junbi_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
